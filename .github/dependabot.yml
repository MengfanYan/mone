version: 2

updates:
  # GitHub Actions 依赖更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 L * *"
      timezone: "UTC"
    open-pull-requests-limit: 3

  # npm 依赖更新
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 9 L * *"
      timezone: "UTC"
    open-pull-requests-limit: 5